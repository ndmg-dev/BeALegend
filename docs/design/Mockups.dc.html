            <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;color:var(--text-muted)"><span style="width:19px;height:19px;border-radius:6px;border:2px dashed currentColor"></span><span style="font-size:10px">Metas</span></div>
          </div>
        </div>

    </figure>

    <!-- ================= EXECUTOR · ESCURO ================= -->
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px">
      <figcaption style="font-size:12px;font-weight:600;color:#a3aab8">B · Executor de treino — escuro</figcaption>
      <div data-theme="dark" data-screen-label="Executor escuro" style="width:390px;height:844px;border-radius:40px;border:1px solid #2b313c;background:var(--bg);color:var(--text);overflow:hidden;position:relative;display:flex;flex-direction:column;font-variant-numeric:tabular-nums">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 24px 6px;font-size:12px;font-weight:600;color:var(--text-secondary)"><span>9:41</span><span style="color:var(--text-muted);font-weight:500">Sessão 18:24</span></div>

        <div style="padding:8px 16px 0;display:flex;align-items:center;gap:12px">
          <button style="width:44px;height:44px;flex:none;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font-size:17px;cursor:pointer">‹</button>
          <div style="flex:1"><div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--training);font-weight:600">Exercício 3 de 6</div><div style="margin-top:2px;height:4px;border-radius:999px;background:var(--surface-sunken);position:relative;overflow:hidden"><div style="position:absolute;inset:0 58% 0 0;background:var(--training);border-radius:999px"></div></div></div>
          <button style="width:44px;height:44px;flex:none;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text-secondary);font:600 13px Inter,sans-serif;cursor:pointer">···</button>

        <div style="flex:1;padding:18px 16px 0;display:flex;flex-direction:column;gap:7px">

          <div style="display:grid;grid-template-columns:24px 1fr 1fr 44px 44px;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;background:var(--nu-900);border:1px solid var(--nu-700)"><div style="font-size:12px;color:var(--text-muted)">1</div><div style="font-size:15px;font-weight:600;color:var(--text-secondary)">82,5 kg</div><div style="font-size:15px;font-weight:600;color:var(--text-secondary)">11</div><div style="font-size:12px;color:var(--text-muted)">2</div><div style="justify-self:end;width:30px;height:30px;border-radius:999px;background:var(--nu-500);display:grid;place-items:center;color:#fff;font-size:13px">✓</div></div>
          <div style="display:grid;grid-template-columns:24px 1fr 1fr 44px 44px;gap:10px;align-items:center;padding:11px 12px;border-radius:10px;background:var(--nu-900);border:1px solid var(--nu-700)"><div style="font-size:12px;color:var(--text-muted)">2</div><div style="font-size:15px;font-weight:600;color:var(--text-secondary)">82,5 kg</div><div style="font-size:15px;font-weight:600;color:var(--text-secondary)">10</div><div style="font-size:12px;color:var(--text-muted)">2</div><div style="justify-self:end;width:30px;height:30px;border-radius:999px;background:var(--nu-500);display:grid;place-items:center;color:#fff;font-size:13px">✓</div></div>
          <div style="display:grid;grid-template-columns:24px 1fr 1fr 44px 44px;gap:10px;align-items:center;padding:13px 12px;border-radius:10px;background:var(--surface-raised);border:2px solid var(--tr-400)"><div style="font-size:12px;font-weight:700;color:var(--tr-300)">3</div><div style="font-size:17px;font-weight:700">82,5 kg</div><div style="font-size:17px;font-weight:700">11</div><div style="font-size:12px;color:var(--text-secondary)">2</div><div style="justify-self:end;width:30px;height:30px;border-radius:999px;border:1px solid var(--border);display:grid;place-items:center;color:var(--text-muted);font-size:13px">✓</div></div>

        <div style="flex:none;padding:16px 16px 26px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;gap:10px">
            <div style="flex:1">
              <div style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px">Carga</div>
              <div style="display:flex;align-items:center;height:52px;border:1px solid var(--border);border-radius:10px;background:var(--surface-sunken);overflow:hidden"><button style="width:48px;height:52px;flex:none;border:none;background:transparent;color:var(--text);font:600 22px Inter,sans-serif;cursor:pointer">−</button><div style="flex:1;text-align:center;font:700 17px Inter,sans-serif">82,5</div><button style="width:48px;height:52px;flex:none;border:none;background:transparent;color:var(--text);font:600 22px Inter,sans-serif;cursor:pointer">+</button></div>

            <div style="flex:1">
              <div style="font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:5px">Reps</div>

    </figure>

    <!-- ================= EXECUTOR · TIMER (claro) ================= -->
    <figure style="margin:0;display:flex;flex-direction:column;gap:12px">
      <figcaption style="font-size:12px;font-weight:600;color:#a3aab8">B · RestTimer após concluir — claro</figcaption>
      <div data-theme="light" data-screen-label="Executor timer claro" style="width:390px;height:844px;border-radius:40px;border:1px solid #2b313c;background:var(--bg);color:var(--text);overflow:hidden;position:relative;display:flex;flex-direction:column;font-variant-numeric:tabular-nums">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 24px 6px;font-size:12px;font-weight:600;color:var(--text-secondary)"><span>9:41</span><span style="color:var(--text-muted);font-weight:500">Sessão 18:52</span></div>

        <div style="padding:8px 16px 0;display:flex;align-items:center;gap:12px;opacity:.5">
          <button style="width:44px;height:44px;flex:none;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font-size:17px;cursor:pointer">‹</button>
          <div style="flex:1"><div style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--training);font-weight:600">Exercício 3 de 6</div><div style="margin-top:2px;height:4px;border-radius:999px;background:var(--surface-sunken);position:relative;overflow:hidden"><div style="position:absolute;inset:0 42% 0 0;background:var(--training);border-radius:999px"></div></div></div>
        </div>

        <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:0 24px">
          <div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted);font-weight:600">Descanso</div>
          <div style="position:relative;width:280px;height:280px">
            <svg viewBox="0 0 100 100" style="width:280px;height:280px;transform:rotate(-90deg)">
              <circle cx="50" cy="50" r="45" fill="none" stroke="var(--border)" stroke-width="4"></circle>
              <circle cx="50" cy="50" r="45" fill="none" stroke="var(--tr-600)" stroke-width="4" stroke-linecap="round" stroke-dasharray="283" stroke-dashoffset="113"></circle>
            </svg>
            <div style="position:absolute;inset:0;display:grid;place-items:center"><div style="text-align:center"><div style="font-size:96px;font-weight:700;letter-spacing:-.04em;line-height:1">1:30</div><div style="margin-top:4px;font-size:14px;color:var(--text-secondary)">de 2:00</div></div></div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--success-bg);color:var(--success);font-size:13px;font-weight:600"><span>✓</span>Série 3 · 82,5 kg × 11 registrada</div>
        </div>

        <div style="flex:none;padding:16px 16px 26px;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;gap:10px">
            <button style="flex:1;height:56px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font:600 16px Inter,sans-serif;cursor:pointer">−15s</button>
            <button style="flex:1;height:56px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--text);font:600 16px Inter,sans-serif;cursor:pointer">+15s</button>
          </div>
          <button style="width:100%;height:64px;border:none;border-radius:10px;background:var(--tr-600);color:#fff;font:700 19px Inter,sans-serif;cursor:pointer">Pular descanso</button>
        </div>
      </div>
    </figure>

  </div>
</div>
