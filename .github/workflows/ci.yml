name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  api:
    name: api — lint e testes com Postgres real
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bealegend
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: bealegend_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bealegend"
          --health-interval 10s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      # A role de runtime existe separada da owner de propósito: é o que faz
      # o RLS valer. Sem ela, os testes de isolamento não provam nada.
      - name: cria a role de runtime
        env:
          PGPASSWORD: changeme
        run: |
          psql -h localhost -U bealegend -d bealegend_test -c \
            "CREATE ROLE bealegend_app LOGIN PASSWORD 'changeme_app';"
      - run: ruff check .
      - run: pytest -q
        env:
          TEST_DATABASE_OWNER_URL: postgresql+asyncpg://bealegend:changeme@localhost:5432/bealegend_test
          TEST_DATABASE_URL: postgresql+asyncpg://bealegend_app:changeme_app@localhost:5432/bealegend_test
          JWT_SECRET: ci-secret

  e2e:
    name: e2e — fluxos críticos contra o stack real
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bealegend
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: bealegend
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bealegend"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm install
      - run: pip install -e ".[dev]"
        working-directory: apps/api

      - name: prepara o banco
        env:
          PGPASSWORD: changeme
        run: |
          psql -h localhost -U bealegend -d bealegend -c \
            "CREATE ROLE bealegend_app LOGIN PASSWORD 'changeme_app';"

      - name: migrations
        working-directory: apps/api
        env:
          DATABASE_OWNER_URL: postgresql+asyncpg://bealegend:changeme@localhost:5432/bealegend
          DATABASE_URL: postgresql+asyncpg://bealegend_app:changeme_app@localhost:5432/bealegend
        run: alembic upgrade head

      - name: sobe a API
        working-directory: apps/api
        env:
          DATABASE_OWNER_URL: postgresql+asyncpg://bealegend:changeme@localhost:5432/bealegend
          DATABASE_URL: postgresql+asyncpg://bealegend_app:changeme_app@localhost:5432/bealegend
          JWT_SECRET: e2e-secret
          CORS_ORIGINS: http://localhost:5173
          # O rate limit real derrubaria a suíte no quinto cadastro. O limite
          # em si é coberto por apps/api/tests/test_rate_limit.py.
          RATE_LIMIT_REGISTER: 1000/minute
          RATE_LIMIT_LOGIN: 1000/minute
          RATE_LIMIT_REFRESH: 1000/minute
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/readyz && break
            sleep 1
          done

      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        env:
          # O seed da planilha roda como subprocesso Python a partir do teste
          # de treino. Explícito em vez de depender do fallback do spec
          # coincidir com a config acima — mesmo que hoje coincida.
          E2E_PYTHON: python
          E2E_DATABASE_OWNER_URL: postgresql+asyncpg://bealegend:changeme@localhost:5432/bealegend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
