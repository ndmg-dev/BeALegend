[project]
name = "bealegend-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.31",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3",
  "passlib[argon2]>=1.7.4",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "pywebpush>=2.0",
  "apscheduler>=3.10",
  "slowapi>=0.1.9",
  "openpyxl>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
