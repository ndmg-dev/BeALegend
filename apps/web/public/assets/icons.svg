<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    Sprite único de ícones — grade 24, traço 1,75, currentColor.
    Ver docs/brand.md e "Marca e Icones.dc.html" para a especificação.
    Nenhum symbol define fill/stroke próprio (exceto os pontos sólidos,
    marcados abaixo): a cor e a espessura vêm de quem usa (.ic em ui/Icon.tsx).
  -->

  <!-- ===== Navegação (tab bar) ===== -->
  <symbol id="tab-hoje" viewBox="0 0 24 24">
    <path d="M3 11l9-7 9 7"/>
    <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/>
  </symbol>
  <symbol id="tab-treino" viewBox="0 0 24 24">
    <path d="M9 12h6"/>
    <path d="M4 9v6"/>
    <path d="M8 10.3v3.4"/>
    <path d="M20 9v6"/>
    <path d="M16 10.3v3.4"/>
  </symbol>
  <symbol id="tab-comer" viewBox="0 0 24 24">
    <path d="M4 12h16a8 8 0 0 1-16 0Z"/>
    <path d="M8 12V7M12 12V5M16 12V7"/>
  </symbol>
  <symbol id="tab-grana" viewBox="0 0 24 24">
    <rect x="3" y="6" width="18" height="13" rx="2"/>
