  <symbol id="trophy" viewBox="0 0 24 24">
    <path d="M7 4h10v4a5 5 0 0 1-10 0V4Z"/>
    <path d="M7 6H4v1.5A3.5 3.5 0 0 0 7.5 11"/>
    <path d="M17 6h3v1.5A3.5 3.5 0 0 1 16.5 11"/>
