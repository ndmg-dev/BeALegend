  <symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></symbol>
  <symbol id="check-circle" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
