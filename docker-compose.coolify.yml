# Deploy no Coolify. Fica na raiz do repo de propósito: o Coolify roda
# `docker compose --project-directory <raiz>`, e `build.context` é resolvido a
# partir dela — um `context: ..` escaparia do repo. Aqui tudo é relativo à raiz.
#
# Diferenças em relação ao infra/docker-compose.yml (VPS puro): sem Caddy. O
# proxy do Coolify termina TLS e roteia o domínio para o serviço `web` (porta
# 80); o nginx do `web` serve o PWA e encaminha /api/* para `api:8000`. A API
# confia em qualquer proxy (--forwarded-allow-ips='*'): proxy do Coolify ->
# nginx -> api.
#
# No Coolify: recurso "Docker Compose", Base Directory `/`, Compose Location
# `/docker-compose.coolify.yml`. Domínio no serviço `web` (porta 80). As
# variáveis abaixo entram na aba Environment.

services:
  db:
    build:
      context: .
      dockerfile: infra/db.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bealegend}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bealegend}
    command: >
      postgres -c bealegend.app_password=${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bealegend} -d ${POSTGRES_DB:-bealegend}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://bealegend_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-bealegend}
      DATABASE_OWNER_URL: postgresql+asyncpg://${POSTGRES_USER:-bealegend}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bealegend}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      APP_ENV: production
      ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN},api,localhost
      CORS_ORIGINS: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN}
      COOKIE_SECURE: "true"
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      # Insights de nutrição por IA (opcional). Sem a flag, os endpoints
      # respondem 204; com a flag e sem chave, o boot falha de propósito.
      NUTRITION_INSIGHTS_ENABLED: ${NUTRITION_INSIGHTS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    command:
      - sh
      - -c
      - alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+asyncpg://bealegend_app:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB:-bealegend}
      DATABASE_OWNER_URL: postgresql+asyncpg://${POSTGRES_USER:-bealegend}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bealegend}
      JWT_SECRET: ${JWT_SECRET}
      APP_ENV: production
      ALLOWED_HOSTS: ${DOMAIN},api,localhost
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      NUTRITION_INSIGHTS_ENABLED: ${NUTRITION_INSIGHTS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import pathlib,sys,time; p=pathlib.Path('/tmp/worker-heartbeat'); sys.exit(0 if p.exists() and time.time()-p.stat().st_mtime<120 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  # Ponto de entrada único: o proxy do Coolify roteia o domínio para cá
  # (porta 80). O nginx serve o PWA e encaminha /api/* para o serviço `api`
  # — mesma origem, então cookie de auth e CSP continuam simples. Sem Caddy:
  # o Coolify sempre quer rotear para este serviço mesmo, então deixamos.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on: [api]
    expose:
      - "80"

volumes:
  pgdata:
